name: Build Clean VPM Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack Clean Zip
        run: |
          # Only zips package.json and the Runtime folder
          zip -r package.zip package.json Runtime/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
